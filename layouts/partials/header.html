<header class="site-header">
  <div class="header-inner container">
    <!-- Brand / Logo -->
    <a href="/" class="header-logo" title="{{ site.Params.brandShort }} 首页">
      <span class="logo-badge">REVIEW</span>
      <span class="logo-text">{{ site.Params.brandShort }}</span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="header-nav desktop-only" aria-label="主导航">
      <ul class="nav-list">
        <li><a href="/"{{ if .IsHome }} class="active"{{ end }}>首页</a></li>
        <li><a href="/reviews/"{{ if eq .Section "reviews" }} class="active"{{ end }}>机场测评</a></li>
        <li><a href="/airports/"{{ if eq .Section "airports" }} class="active"{{ end }}>机场资料库</a></li>
        <li><a href="/choose/"{{ if eq .Section "choose" }} class="active"{{ end }}>新手怎么选</a></li>
        <li><a href="/plans/"{{ if eq .Section "plans" }} class="active"{{ end }}>套餐对比</a></li>
        <li><a href="/clients/"{{ if eq .Section "clients" }} class="active"{{ end }}>客户端教程</a></li>
        <li><a href="/faq/"{{ if eq .Section "faq" }} class="active"{{ end }}>常见问题</a></li>
      </ul>
    </nav>

    <!-- Desktop Right: Search Input + Telegram Button -->
    <div class="header-right desktop-only">
      <div class="search-input-wrapper search-trigger-btn" role="button" tabindex="0" title="点击或按 Ctrl+K 搜索">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span class="search-placeholder">搜索机场、套餐、节点或教程…</span>
        <kbd class="search-kbd">Ctrl K</kbd>
      </div>

      <a href="{{ site.Params.telegramUrl | safeURL }}" target="_blank" rel="sponsored nofollow noopener" class="btn-header-tg">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
        </svg>
        <span>联系我们</span>
      </a>
    </div>

    <!-- Mobile Icons: Search + Hamburger -->
    <div class="header-mobile-controls mobile-only">
      <button class="mobile-search-btn search-trigger-btn" aria-label="打开搜索">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <button id="mobile-menu-toggle" class="mobile-menu-btn" aria-label="切换菜单" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>
</header>

<!-- Mobile Navigation Drawer -->
<div id="mobile-drawer" class="mobile-drawer" aria-hidden="true">
  <div class="drawer-header">
    <span class="drawer-title">{{ site.Params.brandShort }}</span>
    <button id="drawer-close-btn" class="drawer-close" aria-label="关闭菜单">&times;</button>
  </div>
  <nav class="drawer-nav">
    <ul class="drawer-list">
      <li><a href="/">首页</a></li>
      <li><a href="/reviews/">机场测评</a></li>
      <li><a href="/airports/">机场资料</a></li>
      <li><a href="/choose/">新手教程</a></li>
      <li><a href="/plans/">套餐对比</a></li>
      <li><a href="/clients/">客户端</a></li>
      <li><a href="/faq/">常见问题FAQ</a></li>
      <li class="drawer-tg-item">
        <a href="{{ site.Params.telegramUrl | safeURL }}" target="_blank" rel="sponsored nofollow noopener" class="btn-drawer-tg">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
          </svg>
          <span>联系我们 (Telegram)</span>
        </a>
      </li>
    </ul>
  </nav>
</div>
